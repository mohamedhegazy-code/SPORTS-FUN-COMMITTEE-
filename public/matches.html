<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ahlawy — Live Matches</title>
<!-- Standalone "current matches by court" board: no login, meant to be left
     open on a phone/tablet/TV at the venue so players and staff can see
     what's on now and what's up next without asking around. Reuses i18n.js
     the same way screen.html does; has its own small render/refresh loop. -->
<script src="/i18n.js"></script>
<style>
  :root {
    --red: #8b0000;
    --red-dark: #5c0000;
    --gold: #c9a227;
    --bg: #1a1a1a;
    --card-bg: #ffffff;
    --muted: #8a8a8a;
    --border: #e2ddd2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: #222;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .screen-header {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: #fff;
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .screen-header img { max-height: 56px; }
  .screen-header .titles { flex: 1; min-width: 220px; }
  .screen-header h1 { margin: 0; font-size: 2rem; line-height: 1.25; }
  .screen-header .sub { font-size: 1.05rem; opacity: 0.9; margin-top: 4px; }
  .screen-header .live { display: flex; align-items: center; gap: 10px; font-size: 1rem; opacity: 0.9; }
  .live-dot { width: 12px; height: 12px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .screen-body { padding: 32px 40px 70px; max-width: 1500px; margin: 0 auto; }
  .slot-section { margin-bottom: 40px; }
  .slot-section h2 {
    color: #fff; font-size: 1.5rem; font-weight: 800; margin: 0 0 16px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .slot-time { color: var(--gold); font-weight: 600; text-transform: none; font-size: 1rem; }
  .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .match-card {
    background: var(--card-bg); border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.28); border-top: 6px solid var(--gold);
  }
  .match-card.done { border-top-color: var(--muted); opacity: 0.7; }
  .mc-top { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 700; color: var(--red); margin-bottom: 6px; }
  .match-card.done .mc-top { color: var(--muted); }
  .mc-stage { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .mc-teams { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mc-vs { font-size: 0.85rem; color: var(--muted); font-weight: 400; text-transform: lowercase; }
  .empty-state, .picker { color: #fff; text-align: center; padding: 80px 20px; }
  .empty-state h2 { font-size: 1.8rem; }
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 32px; }
  .picker-card {
    background: var(--card-bg); border-radius: 16px; padding: 26px; text-align: start;
    text-decoration: none; color: #222; display: block;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .picker-card h3 { margin: 0 0 8px; color: var(--red); font-size: 1.35rem; }
  .picker-card .meta { color: var(--muted); font-size: 0.95rem; }
  .lang-ar { display: block; }
  .lang-en { display: block; font-size: 0.72em; color: var(--muted); font-weight: 400; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="screen-header">
    <img id="screen-logo" class="hidden" alt="" />
    <div class="titles">
      <h1 id="screen-title">Ahlawy — Live Matches</h1>
      <div class="sub" id="screen-subtitle"></div>
    </div>
    <div class="live"><span class="live-dot"></span><span id="screen-updated"></span></div>
  </div>
  <div class="screen-body" id="screen-body">
    <div class="empty-state"><h2>Loading…</h2></div>
  </div>

<script src="/matches.js"></script>
</body>
</html>
