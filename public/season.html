<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyAhlawy — Season Calendar</title>
<!-- Public season calendar: every dated league match and the reserved finals of
     a season (an event day's age categories), grouped by day, plus each
     category's table. No login; reuses i18n.js like matches.html. -->
<script src="/i18n.js"></script>
<style>
  :root { --red: #8b0000; --red-dark: #5c0000; --gold: #c9a227; --bg: #f6f3ec; --card: #ffffff; --ink: #222; --muted: #6f6a5f; --border: #e2ddd2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  .head { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; padding: 22px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .head img { max-height: 52px; }
  .head h1 { margin: 0; font-size: 1.6rem; line-height: 1.25; }
  .head .sub { opacity: 0.9; margin-top: 4px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .day { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
  .day h2 { margin: 0; padding: 12px 16px; font-size: 1.05rem; background: #efe9da; border-bottom: 1px solid var(--border); }
  .rows { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.teams { white-space: normal; min-width: 200px; }
  .tag { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: #efe9da; color: var(--ink); }
  .tag.final { background: var(--gold); color: #fff; }
  .tag.third { background: #b87333; color: #fff; }
  .score { font-weight: 700; }
  .tbd { color: var(--muted); font-style: italic; }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 8px; }
  .cat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .cat h3 { margin: 0; padding: 10px 14px; font-size: 1rem; background: #efe9da; }
  .awards { padding: 10px 14px 14px; border-top: 1px solid var(--border); }
  .awards h4 { margin: 0 0 6px; font-size: 0.95rem; }
  .award-line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
  .award-line > span:first-child { font-weight: 700; }
  .empty { padding: 60px 10px; text-align: center; color: var(--muted); }
  h2.section { margin: 26px 0 10px; font-size: 1.2rem; }
  .lang-ar { display: block; } .lang-en { display: block; font-size: 0.75em; opacity: 0.85; font-weight: 400; }
  /* Phones: each match becomes a two-line card instead of a sideways-scrolling table row. */
  @media (max-width: 640px) {
    .day table, .day tbody { display: block; }
    .day tr { display: grid; grid-template-columns: auto auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .day tr:last-child { border-bottom: 0; }
    .day td { border: 0; padding: 0; }
    .day td:nth-child(1) { grid-column: 1; grid-row: 1; font-weight: 700; }
    .day td:nth-child(2) { grid-column: 2; grid-row: 1; color: var(--muted); font-size: 0.85rem; }
    .day td:nth-child(3) { grid-column: 3; grid-row: 1; font-size: 0.85rem; white-space: normal; }
    .day td:nth-child(4) { grid-column: 4; grid-row: 1; justify-self: end; }
    .day td:nth-child(5) { grid-column: 1 / 4; grid-row: 2; min-width: 0; }
    .day td:nth-child(6) { grid-column: 4; grid-row: 2; justify-self: end; }
  }
</style>
</head>
<body>
  <div class="head">
    <img id="logo" alt="" hidden />
    <div><h1 id="title">Season calendar</h1><div class="sub" id="subtitle"></div></div>
  </div>
  <div class="wrap" id="body"><div class="empty">…</div></div>
<script src="/season.js"></script>
</body>
</html>
